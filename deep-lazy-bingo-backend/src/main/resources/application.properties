spring.application.name=deep-lazy-bingo-backend
spring.profiles.default=local
server.address=${BINGO_SERVER_ADDRESS:127.0.0.1}
server.port=${BINGO_SERVER_PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

spring.datasource.url=jdbc:postgresql://${BINGO_DB_HOST:li19posdb11vm.bmwgroup.net}:${BINGO_DB_PORT:5620}/${BINGO_DB_NAME:pos_chat_dev}?sslmode=${BINGO_DB_SSLMODE:verify-full}&connectTimeout=5&socketTimeout=10&ApplicationName=bingo_backend
spring.datasource.username=${BINGO_DB_USERNAME:pos_dev}
spring.datasource.password=${BINGO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=bingo_pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

spring.data.redis.host=${BINGO_REDIS_HOST:lt19dkpos09vm.bmwgroup.net}
spring.data.redis.port=${BINGO_REDIS_PORT:6300}
spring.data.redis.password=${BINGO_REDIS_PASSWORD}
spring.data.redis.database=3
spring.data.redis.ssl.enabled=${BINGO_REDIS_SSL_ENABLED:true}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s
spring.data.redis.repositories.enabled=false

spring.flyway.enabled=${BINGO_FLYWAY_ENABLED:false}
spring.flyway.table=bingo_flyway_schema_history
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.lifecycle.timeout-per-shutdown-phase=15s

mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.table-prefix=bingo_
mybatis-plus.global-config.db-config.id-type=assign_uuid
mybatis-plus.configuration.map-underscore-to-camel-case=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

springdoc.api-docs.enabled=${BINGO_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${BINGO_API_DOCS_ENABLED:false}
logging.pattern.level=%5p [requestId=%X{requestId:-}]
bingo.ai.enabled=false
